<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2050" viewBox="0 0 1600 2050">
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 36px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 18px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #556070; }
      .laneTitle { font: 700 23px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #14213d; }
      .nodeText { font: 500 17px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2a3d; }
      .smallText { font: 500 14px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #4e5b6d; }
      .node { fill: #ffffff; stroke: #8aa0bd; stroke-width: 2; rx: 12; }
      .start { fill: #e7f8ef; stroke: #35a66b; }
      .decision { fill: #fff5db; stroke: #e6a700; }
      .system { fill: #edf2ff; stroke: #5b7cfa; }
      .danger { fill: #fff1f0; stroke: #f05b53; }
      .done { fill: #e9fbff; stroke: #00a7c8; }
      .lane { fill: #ffffff; stroke: #d6deeb; stroke-width: 2; rx: 18; }
      .arrow { fill: none; stroke: #596579; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrowSoft { fill: none; stroke: #8792a4; stroke-width: 1.8; marker-end: url(#arrowSoft); }
      .dash { fill: none; stroke: #8792a4; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrowSoft); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#596579"/>
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9 Z" fill="#8792a4"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="2050"/>
  <text class="title" x="80" y="70">钓鱼游戏优化推进流程图</text>
  <text class="subtitle" x="80" y="105">基于 fishgame-coco 当前结构：src/runtime/game.js 为 Web / 微信小游戏共用运行时</text>

  <rect class="node start" x="630" y="145" width="340" height="68"/>
  <text class="nodeText" x="800" y="174" text-anchor="middle">开始优化</text>
  <text class="smallText" x="800" y="198" text-anchor="middle">明确目标、版本、验收范围</text>

  <rect class="node" x="585" y="255" width="430" height="76"/>
  <text class="nodeText" x="800" y="285" text-anchor="middle">读取项目现状</text>
  <text class="smallText" x="800" y="310" text-anchor="middle">README / game.js / FishingGame.ts / game-data.ts</text>

  <polygon class="decision" points="800,380 1005,455 800,530 595,455"/>
  <text class="nodeText" x="800" y="446" text-anchor="middle">先判断优化类型</text>
  <text class="smallText" x="800" y="471" text-anchor="middle">玩法 / 数值 / 内容 / UI / 平台 / 存档</text>

  <path class="arrow" d="M800 213 L800 255"/>
  <path class="arrow" d="M800 331 L800 380"/>

  <rect class="lane" x="70" y="590" width="700" height="420"/>
  <text class="laneTitle" x="105" y="635">A. 主玩法手感与状态机</text>
  <rect class="node start" x="110" y="670" width="170" height="60"/>
  <text class="nodeText" x="195" y="706" text-anchor="middle">idle 待机</text>
  <rect class="node" x="330" y="670" width="180" height="60"/>
  <text class="nodeText" x="420" y="697" text-anchor="middle">检查鱼饵</text>
  <text class="smallText" x="420" y="718" text-anchor="middle">不足则引导商店</text>
  <rect class="node" x="560" y="670" width="170" height="60"/>
  <text class="nodeText" x="645" y="706" text-anchor="middle">waiting 等待</text>

  <rect class="node" x="110" y="790" width="170" height="60"/>
  <text class="nodeText" x="195" y="826" text-anchor="middle">hooked 上钩</text>
  <rect class="node" x="330" y="790" width="180" height="60"/>
  <text class="nodeText" x="420" y="817" text-anchor="middle">startHitbar</text>
  <text class="smallText" x="420" y="838" text-anchor="middle">rollCatch 生成目标</text>
  <rect class="node" x="560" y="790" width="170" height="60"/>
  <text class="nodeText" x="645" y="826" text-anchor="middle">reeling 收线</text>

  <rect class="node done" x="205" y="910" width="200" height="60"/>
  <text class="nodeText" x="305" y="936" text-anchor="middle">applyCatch 结算</text>
  <text class="smallText" x="305" y="957" text-anchor="middle">金币/钻石/图鉴/历史</text>
  <rect class="node danger" x="470" y="910" width="220" height="60"/>
  <text class="nodeText" x="580" y="936" text-anchor="middle">失败分支</text>
  <text class="smallText" x="580" y="957" text-anchor="middle">超时、未命中、鱼逃脱</text>

  <path class="arrowSoft" d="M280 700 L330 700"/>
  <path class="arrowSoft" d="M510 700 L560 700"/>
  <path class="arrowSoft" d="M645 730 C645 760 195 760 195 790"/>
