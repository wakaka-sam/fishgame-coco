  <path class="arrowSoft" d="M645 850 C645 890 370 890 335 910"/>
  <path class="dash" d="M645 850 C700 875 700 900 690 920"/>

  <rect class="lane" x="830" y="590" width="700" height="420"/>
  <text class="laneTitle" x="865" y="635">B. 经济数值与长期成长</text>
  <rect class="node system" x="875" y="670" width="250" height="68"/>
  <text class="nodeText" x="1000" y="697" text-anchor="middle">鱼饵与鱼池</text>
  <text class="smallText" x="1000" y="720" text-anchor="middle">BAITS / TRASH / TREASURE</text>
  <rect class="node system" x="1230" y="670" width="250" height="68"/>
  <text class="nodeText" x="1355" y="697" text-anchor="middle">稀有度与命中难度</text>
  <text class="smallText" x="1355" y="720" text-anchor="middle">weightedRarity / HITS_BY_RARITY</text>
  <rect class="node system" x="875" y="790" width="250" height="68"/>
  <text class="nodeText" x="1000" y="817" text-anchor="middle">奖励公式</text>
  <text class="smallText" x="1000" y="840" text-anchor="middle">重量 * price + 特殊钻石</text>
  <rect class="node system" x="1230" y="790" width="250" height="68"/>
  <text class="nodeText" x="1355" y="817" text-anchor="middle">加成系统</text>
  <text class="smallText" x="1355" y="840" text-anchor="middle">宠物 bonus / 首饰效果</text>
  <rect class="node done" x="1025" y="910" width="310" height="60"/>
  <text class="nodeText" x="1180" y="936" text-anchor="middle">收益曲线验收</text>
  <text class="smallText" x="1180" y="957" text-anchor="middle">新手不卡死，稀有目标有追求</text>
  <path class="arrowSoft" d="M1125 704 L1230 704"/>
  <path class="arrowSoft" d="M1000 738 L1000 790"/>
  <path class="arrowSoft" d="M1355 738 L1355 790"/>
  <path class="arrowSoft" d="M1125 824 C1175 850 1180 875 1180 910"/>
  <path class="arrowSoft" d="M1355 858 C1340 890 1295 905 1240 910"/>

  <rect class="lane" x="70" y="1060" width="700" height="390"/>
  <text class="laneTitle" x="105" y="1105">C. 内容扩展与资源接入</text>
  <rect class="node" x="110" y="1140" width="250" height="68"/>
  <text class="nodeText" x="235" y="1167" text-anchor="middle">新增内容设计</text>
  <text class="smallText" x="235" y="1190" text-anchor="middle">鱼、宝藏、鱼竿、角色、宠物、首饰</text>
  <rect class="node" x="470" y="1140" width="240" height="68"/>
  <text class="nodeText" x="590" y="1167" text-anchor="middle">补数据表</text>
  <text class="smallText" x="590" y="1190" text-anchor="middle">常量、奖池、解锁条件</text>
  <rect class="node" x="110" y="1260" width="250" height="68"/>
  <text class="nodeText" x="235" y="1287" text-anchor="middle">补资源映射</text>
  <text class="smallText" x="235" y="1310" text-anchor="middle">registerAssets / preloadAssets</text>
  <rect class="node" x="470" y="1260" width="240" height="68"/>
  <text class="nodeText" x="590" y="1287" text-anchor="middle">补展示入口</text>
  <text class="smallText" x="590" y="1310" text-anchor="middle">图鉴、抽奖、装备、结果弹窗</text>
  <rect class="node done" x="235" y="1370" width="290" height="52"/>
  <text class="nodeText" x="380" y="1403" text-anchor="middle">重复获得与存档兼容验收</text>
  <path class="arrowSoft" d="M360 1174 L470 1174"/>
  <path class="arrowSoft" d="M590 1208 C590 1235 235 1235 235 1260"/>
  <path class="arrowSoft" d="M360 1294 L470 1294"/>
  <path class="arrowSoft" d="M590 1328 C590 1350 455 1360 420 1370"/>

  <rect class="lane" x="830" y="1060" width="700" height="390"/>
  <text class="laneTitle" x="865" y="1105">D. UI、触控与平台适配</text>
  <rect class="node" x="875" y="1140" width="250" height="68"/>
  <text class="nodeText" x="1000" y="1167" text-anchor="middle">界面分层</text>
  <text class="smallText" x="1000" y="1190" text-anchor="middle">topbar / scene / gamebar / modal</text>
  <rect class="node" x="1230" y="1140" width="250" height="68"/>
  <text class="nodeText" x="1355" y="1167" text-anchor="middle">触控目标</text>
  <text class="smallText" x="1355" y="1190" text-anchor="middle">targets / handleTap / handleAction</text>
  <rect class="node" x="875" y="1260" width="250" height="68"/>
  <text class="nodeText" x="1000" y="1287" text-anchor="middle">小屏与安全区</text>
  <text class="smallText" x="1000" y="1310" text-anchor="middle">DPR / safeArea / 文字截断</text>
  <rect class="node" x="1230" y="1260" width="250" height="68"/>
  <text class="nodeText" x="1355" y="1287" text-anchor="middle">性能与资源兜底</text>
  <text class="smallText" x="1355" y="1310" text-anchor="middle">图片加载失败、渲染频率、遮挡</text>
  <rect class="node done" x="1035" y="1370" width="290" height="52"/>
  <text class="nodeText" x="1180" y="1403" text-anchor="middle">真机可用性验收</text>
  <path class="arrowSoft" d="M1125 1174 L1230 1174"/>
  <path class="arrowSoft" d="M1000 1208 L1000 1260"/>
  <path class="arrowSoft" d="M1355 1208 L1355 1260"/>
  <path class="arrowSoft" d="M1125 1294 C1170 1330 1180 1350 1180 1370"/>
  <path class="arrowSoft" d="M1355 1328 C1330 1355 1265 1368 1220 1370"/>

  <rect class="lane" x="70" y="1500" width="1460" height="330"/>
  <text class="laneTitle" x="105" y="1545">E. 统一开发、构建、验证、发布</text>
  <rect class="node start" x="110" y="1590" width="210" height="62"/>
  <text class="nodeText" x="215" y="1627" text-anchor="middle">修改共用源</text>
  <text class="smallText" x="215" y="1647" text-anchor="middle">src/runtime/game.js</text>
  <rect class="node" x="380" y="1590" width="210" height="62"/>
  <text class="nodeText" x="485" y="1627" text-anchor="middle">同步构建</text>
  <text class="smallText" x="485" y="1647" text-anchor="middle">npm run build:unified</text>
  <rect class="node" x="650" y="1590" width="210" height="62"/>
  <text class="nodeText" x="755" y="1627" text-anchor="middle">Web 冒烟</text>
  <text class="smallText" x="755" y="1647" text-anchor="middle">serve:web / 浏览器验证</text>
  <rect class="node" x="920" y="1590" width="210" height="62"/>
  <text class="nodeText" x="1025" y="1627" text-anchor="middle">微信预览</text>
  <text class="smallText" x="1025" y="1647" text-anchor="middle">preview / 真机验证</text>
  <polygon class="decision" points="1290,1578 1430,1621 1290,1664 1150,1621"/>
  <text class="nodeText" x="1290" y="1616" text-anchor="middle">验收通过?</text>
  <text class="smallText" x="1290" y="1638" text-anchor="middle">功能 / 数值 / UI / 存档</text>

  <rect class="node danger" x="845" y="1725" width="250" height="58"/>
  <text class="nodeText" x="970" y="1759" text-anchor="middle">记录问题并回到分类</text>
  <rect class="node done" x="1195" y="1725" width="250" height="58"/>
  <text class="nodeText" x="1320" y="1759" text-anchor="middle">版本说明与发布</text>

  <path class="arrow" d="M320 1621 L380 1621"/>
  <path class="arrow" d="M590 1621 L650 1621"/>
  <path class="arrow" d="M860 1621 L920 1621"/>
  <path class="arrow" d="M1130 1621 L1150 1621"/>
  <path class="arrow" d="M1290 1664 L1320 1725"/>
  <path class="arrowSoft" d="M1150 1621 C1090 1690 1040 1710 970 1725"/>
  <path class="dash" d="M970 1725 C710 1830 360 1660 595 455"/>

  <path class="arrowSoft" d="M635 490 C365 540 260 560 230 590"/>
  <path class="arrowSoft" d="M965 490 C1190 540 1240 560 1220 590"/>
  <path class="arrowSoft" d="M685 520 C385 810 290 990 300 1060"/>
  <path class="arrowSoft" d="M915 520 C1230 820 1300 980 1240 1060"/>
  <path class="arrowSoft" d="M800 530 L800 1500"/>

  <text class="subtitle" x="80" y="1900">关键原则：先稳定主循环，再调数值与内容，最后做 UI、平台、存档与发布验证。每轮都要回到统一验收清单。</text>
  <text class="smallText" x="80" y="1935">验收清单：抛竿/上钩/收线/失败/结算走通；鱼饵和货币不足有反馈；弹窗不遮挡；旧存档 normalize 后可继续；Web 与微信输出来自同一源。</text>
</svg>
