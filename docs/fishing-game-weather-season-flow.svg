<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2360" viewBox="0 0 1800 2360">
  <defs>
    <style>
      .bg { fill: #f5f8fc; }
      .title { font: 700 38px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #142033; }
      .subtitle { font: 500 18px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #586579; }
      .lane { fill: #ffffff; stroke: #d7e0ee; stroke-width: 2; rx: 20; }
      .laneTitle { font: 700 24px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #14213d; }
      .node { fill: #ffffff; stroke: #8ba0ba; stroke-width: 2; rx: 13; }
      .start { fill: #e8f8ef; stroke: #31a66a; }
      .weather { fill: #eaf6ff; stroke: #3398db; }
      .season { fill: #fff4de; stroke: #d99b1d; }
      .forecast { fill: #f1ecff; stroke: #7b61ff; }
      .effect { fill: #ecfff8; stroke: #14a36f; }
      .decision { fill: #fff9e8; stroke: #dfa400; }
      .danger { fill: #fff0ef; stroke: #e45d55; }
      .done { fill: #eafcff; stroke: #00a6c8; }
      .text { font: 500 17px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f2b3d; }
      .small { font: 500 14px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #526071; }
      .tiny { font: 500 12px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #647086; }
      .arrow { fill: none; stroke: #596579; stroke-width: 2.2; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #8693a6; stroke-width: 1.8; marker-end: url(#softArrow); }
      .dash { fill: none; stroke: #8693a6; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#softArrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#596579"/>
    </marker>
    <marker id="softArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9 Z" fill="#8693a6"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="2360"/>
  <text class="title" x="80" y="72">钓鱼游戏天气、天气预报与季节系统流程图</text>
  <text class="subtitle" x="80" y="108">新增环境系统接入现有主循环：src/runtime/game.js 统一承载 Web / 微信小游戏逻辑</text>

  <rect class="node start" x="700" y="150" width="400" height="70"/>
  <text class="text" x="900" y="180" text-anchor="middle">开始优化</text>
  <text class="small" x="900" y="203" text-anchor="middle">在现有钓鱼主循环上接入环境系统</text>

  <rect class="node" x="675" y="260" width="450" height="72"/>
  <text class="text" x="900" y="289" text-anchor="middle">确认改动入口</text>
  <text class="small" x="900" y="312" text-anchor="middle">src/runtime/game.js + normalize 存档兼容</text>

  <polygon class="decision" points="900,380 1110,455 900,530 690,455"/>
  <text class="text" x="900" y="447" text-anchor="middle">新增三大系统</text>
  <text class="small" x="900" y="471" text-anchor="middle">季节 / 天气 / 预报</text>

  <path class="arrow" d="M900 220 L900 260"/>
  <path class="arrow" d="M900 332 L900 380"/>

  <rect class="lane" x="70" y="585" width="520" height="430"/>
  <text class="laneTitle" x="105" y="630">A. 季节系统</text>
  <rect class="node season" x="115" y="665" width="210" height="64"/>
  <text class="text" x="220" y="691" text-anchor="middle">定义季节</text>
  <text class="small" x="220" y="713" text-anchor="middle">春 / 夏 / 秋 / 冬</text>
  <rect class="node season" x="335" y="665" width="210" height="64"/>
  <text class="text" x="440" y="691" text-anchor="middle">推进规则</text>
  <text class="small" x="440" y="713" text-anchor="middle">按游戏日或真实日期</text>
  <rect class="node season" x="115" y="785" width="210" height="64"/>
  <text class="text" x="220" y="811" text-anchor="middle">季节鱼池</text>
  <text class="small" x="220" y="833" text-anchor="middle">seasonTags / 限定鱼</text>
  <rect class="node season" x="335" y="785" width="210" height="64"/>
  <text class="text" x="440" y="811" text-anchor="middle">季节表现</text>
  <text class="small" x="440" y="833" text-anchor="middle">场景色调 / 活动内容</text>
  <rect class="node done" x="165" y="920" width="330" height="58"/>
  <text class="text" x="330" y="944" text-anchor="middle">输出 seasonEffect</text>
  <text class="small" x="330" y="965" text-anchor="middle">鱼池、奖励、场景、图鉴目标</text>
  <path class="soft" d="M325 697 L335 697"/>
  <path class="soft" d="M220 729 L220 785"/>
  <path class="soft" d="M440 729 L440 785"/>
  <path class="soft" d="M220 849 C240 895 285 910 330 920"/>
  <path class="soft" d="M440 849 C420 895 375 910 330 920"/>

  <rect class="lane" x="640" y="585" width="520" height="430"/>
  <text class="laneTitle" x="675" y="630">B. 天气系统</text>
  <rect class="node weather" x="685" y="665" width="210" height="64"/>
  <text class="text" x="790" y="691" text-anchor="middle">定义天气</text>
  <text class="small" x="790" y="713" text-anchor="middle">晴 / 阴 / 雨 / 雾 / 雪</text>
  <rect class="node weather" x="905" y="665" width="210" height="64"/>
  <text class="text" x="1010" y="691" text-anchor="middle">极端天气</text>
  <text class="small" x="1010" y="713" text-anchor="middle">暴雨 / 雷暴</text>
  <rect class="node weather" x="685" y="785" width="210" height="64"/>
  <text class="text" x="790" y="811" text-anchor="middle">玩法影响</text>
  <text class="small" x="790" y="833" text-anchor="middle">等待 / 掉率 / 命中条</text>
  <rect class="node weather" x="905" y="785" width="210" height="64"/>
  <text class="text" x="1010" y="811" text-anchor="middle">视觉影响</text>
  <text class="small" x="1010" y="833" text-anchor="middle">天空 / 水面 / 雨雪雾雷</text>
  <rect class="node done" x="735" y="920" width="330" height="58"/>
  <text class="text" x="900" y="944" text-anchor="middle">输出 weatherEffect</text>
  <text class="small" x="900" y="965" text-anchor="middle">biteWait / rarity / hitbar / VFX</text>
  <path class="soft" d="M895 697 L905 697"/>
  <path class="soft" d="M790 729 L790 785"/>
  <path class="soft" d="M1010 729 L1010 785"/>
  <path class="soft" d="M790 849 C810 895 855 910 900 920"/>
  <path class="soft" d="M1010 849 C990 895 945 910 900 920"/>

  <rect class="lane" x="1210" y="585" width="520" height="430"/>
  <text class="laneTitle" x="1245" y="630">C. 天气预报系统</text>
  <rect class="node forecast" x="1255" y="665" width="210" height="64"/>
  <text class="text" x="1360" y="691" text-anchor="middle">生成预报</text>
  <text class="small" x="1360" y="713" text-anchor="middle">未来 3 到 7 天</text>
  <rect class="node forecast" x="1475" y="665" width="210" height="64"/>
  <text class="text" x="1580" y="691" text-anchor="middle">稳定随机</text>
  <text class="small" x="1580" y="713" text-anchor="middle">同一天不反复变化</text>
  <rect class="node forecast" x="1255" y="785" width="210" height="64"/>
  <text class="text" x="1360" y="811" text-anchor="middle">预报入口</text>
  <text class="small" x="1360" y="833" text-anchor="middle">顶部按钮 / 弹窗</text>
  <rect class="node forecast" x="1475" y="785" width="210" height="64"/>
  <text class="text" x="1580" y="811" text-anchor="middle">推荐策略</text>
  <text class="small" x="1580" y="833" text-anchor="middle">鱼饵 / 目标鱼 / 活动</text>
  <rect class="node done" x="1305" y="920" width="330" height="58"/>
  <text class="text" x="1470" y="944" text-anchor="middle">输出 forecastQueue</text>
  <text class="small" x="1470" y="965" text-anchor="middle">今日天气 + 未来预告</text>
  <path class="soft" d="M1465 697 L1475 697"/>
  <path class="soft" d="M1360 729 L1360 785"/>
  <path class="soft" d="M1580 729 L1580 785"/>
  <path class="soft" d="M1360 849 C1380 895 1425 910 1470 920"/>
  <path class="soft" d="M1580 849 C1560 895 1515 910 1470 920"/>

  <path class="soft" d="M740 500 C430 545 330 560 330 585"/>
  <path class="soft" d="M900 530 L900 585"/>
  <path class="soft" d="M1060 500 C1370 545 1470 560 1470 585"/>

  <rect class="lane" x="70" y="1065" width="1660" height="430"/>
  <text class="laneTitle" x="105" y="1110">D. 日历、预报与环境效果计算</text>
  <rect class="node start" x="115" y="1150" width="220" height="66"/>
  <text class="text" x="225" y="1177" text-anchor="middle">游戏启动</text>
  <text class="small" x="225" y="1199" text-anchor="middle">loadUser / onShow</text>
  <rect class="node" x="390" y="1150" width="220" height="66"/>
  <text class="text" x="500" y="1177" text-anchor="middle">normalize</text>
  <text class="small" x="500" y="1199" text-anchor="middle">补 calendar 默认值</text>
  <polygon class="decision" points="775,1145 930,1183 775,1221 620,1183"/>
  <text class="text" x="775" y="1179" text-anchor="middle">跨游戏日?</text>
  <text class="tiny" x="775" y="1198" text-anchor="middle">lastTickAt 判断</text>
  <rect class="node" x="980" y="1150" width="220" height="66"/>
  <text class="text" x="1090" y="1177" text-anchor="middle">推进日期</text>
  <text class="small" x="1090" y="1199" text-anchor="middle">gameDay + season</text>
  <rect class="node forecast" x="1255" y="1150" width="220" height="66"/>
  <text class="text" x="1365" y="1177" text-anchor="middle">补齐预报</text>
  <text class="small" x="1365" y="1199" text-anchor="middle">shift + generateForecast</text>
  <rect class="node effect" x="685" y="1320" width="430" height="68"/>
  <text class="text" x="900" y="1347" text-anchor="middle">resolveEnvironmentEffects</text>
  <text class="small" x="900" y="1370" text-anchor="middle">合并季节 + 天气 + 宠物 + 首饰效果</text>
  <rect class="node done" x="1220" y="1320" width="300" height="68"/>
  <text class="text" x="1370" y="1347" text-anchor="middle">保存并刷新 UI</text>
  <text class="small" x="1370" y="1370" text-anchor="middle">saveUser / topbar / scene</text>
  <path class="arrow" d="M335 1183 L390 1183"/>
  <path class="arrow" d="M610 1183 L620 1183"/>
  <path class="arrow" d="M930 1183 L980 1183"/>
  <path class="arrow" d="M1200 1183 L1255 1183"/>
  <path class="soft" d="M1365 1216 C1365 1265 1110 1290 1010 1320"/>
  <path class="soft" d="M775 1221 C775 1270 815 1295 860 1320"/>
  <path class="arrow" d="M1115 1354 L1220 1354"/>

  <rect class="lane" x="70" y="1545" width="1660" height="520"/>
  <text class="laneTitle" x="105" y="1590">E. 接入钓鱼主循环</text>
  <rect class="node start" x="115" y="1640" width="190" height="62"/>
  <text class="text" x="210" y="1676" text-anchor="middle">玩家抛竿</text>
  <rect class="node" x="365" y="1640" width="210" height="62"/>
  <text class="text" x="470" y="1665" text-anchor="middle">cast</text>
  <text class="small" x="470" y="1687" text-anchor="middle">等待 *= biteWait</text>
  <rect class="node" x="635" y="1640" width="210" height="62"/>
  <text class="text" x="740" y="1665" text-anchor="middle">waiting / hooked</text>
  <text class="small" x="740" y="1687" text-anchor="middle">天气反馈 + 反应窗口</text>
  <rect class="node" x="905" y="1640" width="210" height="62"/>
  <text class="text" x="1010" y="1665" text-anchor="middle">rollCatch</text>
  <text class="small" x="1010" y="1687" text-anchor="middle">季节/天气鱼池 + 概率</text>
  <rect class="node" x="1175" y="1640" width="210" height="62"/>
  <text class="text" x="1280" y="1665" text-anchor="middle">startHitbar</text>
  <text class="small" x="1280" y="1687" text-anchor="middle">速度/宽度/次数修正</text>
  <polygon class="decision" points="1530,1628 1680,1671 1530,1714 1380,1671"/>
  <text class="text" x="1530" y="1667" text-anchor="middle">命中达标?</text>
  <text class="tiny" x="1530" y="1687" text-anchor="middle">连续命中</text>

  <rect class="node danger" x="1330" y="1785" width="230" height="62"/>
  <text class="text" x="1445" y="1811" text-anchor="middle">失败分支</text>
  <text class="small" x="1445" y="1833" text-anchor="middle">鱼逃脱 / 连击清零</text>
  <rect class="node done" x="895" y="1785" width="280" height="62"/>
  <text class="text" x="1035" y="1811" text-anchor="middle">applyCatch</text>
  <text class="small" x="1035" y="1833" text-anchor="middle">奖励 + 天气/季节加成</text>
  <rect class="node done" x="540" y="1785" width="280" height="62"/>
  <text class="text" x="680" y="1811" text-anchor="middle">图鉴与结果弹窗</text>
  <text class="small" x="680" y="1833" text-anchor="middle">展示限定标签和加成来源</text>
  <rect class="node" x="235" y="1785" width="230" height="62"/>
  <text class="text" x="350" y="1811" text-anchor="middle">saveUser</text>
  <text class="small" x="350" y="1833" text-anchor="middle">回到 idle</text>

  <path class="arrow" d="M305 1671 L365 1671"/>
  <path class="arrow" d="M575 1671 L635 1671"/>
  <path class="arrow" d="M845 1671 L905 1671"/>
  <path class="arrow" d="M1115 1671 L1175 1671"/>
  <path class="arrow" d="M1385 1671 L1380 1671"/>
  <path class="soft" d="M1530 1714 C1530 1755 1490 1770 1455 1785"/>
  <path class="arrow" d="M1380 1671 C1290 1740 1195 1770 1120 1785"/>
  <path class="arrow" d="M895 1816 L820 1816"/>
  <path class="arrow" d="M540 1816 L465 1816"/>
  <path class="dash" d="M350 1785 C300 1730 240 1720 210 1702"/>

  <rect class="lane" x="70" y="2115" width="1660" height="165"/>
  <text class="laneTitle" x="105" y="2160">F. 验收与发布</text>
  <rect class="node" x="115" y="2190" width="260" height="54"/>
  <text class="text" x="245" y="2222" text-anchor="middle">旧存档兼容</text>
  <rect class="node" x="430" y="2190" width="260" height="54"/>
  <text class="text" x="560" y="2222" text-anchor="middle">预报稳定不乱跳</text>
  <rect class="node" x="745" y="2190" width="260" height="54"/>
  <text class="text" x="875" y="2222" text-anchor="middle">多天气多季节抽样</text>
  <rect class="node" x="1060" y="2190" width="260" height="54"/>
  <text class="text" x="1190" y="2222" text-anchor="middle">小屏 UI 不遮挡</text>
  <rect class="node done" x="1375" y="2190" width="280" height="54"/>
  <text class="text" x="1515" y="2222" text-anchor="middle">build:unified 后发布</text>
  <path class="soft" d="M375 2217 L430 2217"/>
  <path class="soft" d="M690 2217 L745 2217"/>
  <path class="soft" d="M1005 2217 L1060 2217"/>
  <path class="soft" d="M1320 2217 L1375 2217"/>

  <path class="arrow" d="M900 1495 L900 1545"/>
  <path class="arrow" d="M900 1015 L900 1065"/>
  <text class="subtitle" x="80" y="2325">核心原则：预报先稳定，天气/季节再影响玩法，最后补 UI 反馈和存档兼容。</text>
</svg>
