  <rect class="lane" x="70" y="625" width="1760" height="500"/>
  <text class="laneTitle" x="105" y="672">2. 主玩法状态机（原流程保留，插入天气/季节影响）</text>
  <rect class="node start" x="115" y="715" width="175" height="60"/>
  <text class="text" x="203" y="751" text-anchor="middle">idle 待机</text>
  <rect class="node core" x="345" y="715" width="190" height="60"/>
  <text class="text" x="440" y="740" text-anchor="middle">检查鱼饵</text>
  <text class="small" x="440" y="761" text-anchor="middle">不足引导商店</text>
  <rect class="node weather" x="590" y="715" width="220" height="60"/>
  <text class="text" x="700" y="740" text-anchor="middle">读取 env</text>
  <text class="small" x="700" y="761" text-anchor="middle">天气/季节/首饰/宠物</text>
  <rect class="node core" x="865" y="715" width="190" height="60"/>
  <text class="text" x="960" y="740" text-anchor="middle">cast</text>
  <text class="small" x="960" y="761" text-anchor="middle">扣鱼饵、算等待</text>
  <rect class="node core" x="1110" y="715" width="190" height="60"/>
  <text class="text" x="1205" y="751" text-anchor="middle">waiting</text>
  <rect class="node core" x="1355" y="715" width="190" height="60"/>
  <text class="text" x="1450" y="751" text-anchor="middle">hooked</text>
  <rect class="node danger" x="1595" y="715" width="175" height="60"/>
  <text class="text" x="1683" y="740" text-anchor="middle">超时逃脱</text>
  <text class="small" x="1683" y="761" text-anchor="middle">回到 idle</text>

  <rect class="node core" x="200" y="850" width="210" height="62"/>
  <text class="text" x="305" y="876" text-anchor="middle">startHitbar</text>
  <text class="small" x="305" y="898" text-anchor="middle">天气修正速度/宽度</text>
  <rect class="node core" x="480" y="850" width="210" height="62"/>
  <text class="text" x="585" y="876" text-anchor="middle">rollCatch</text>
  <text class="small" x="585" y="898" text-anchor="middle">鱼池 + 稀有度计算</text>
  <rect class="node weather" x="760" y="850" width="250" height="62"/>
  <text class="text" x="885" y="876" text-anchor="middle">应用限定规则</text>
  <text class="small" x="885" y="898" text-anchor="middle">seasonTags / weatherTags</text>
  <rect class="node core" x="1080" y="850" width="210" height="62"/>
  <text class="text" x="1185" y="876" text-anchor="middle">reeling</text>
  <text class="small" x="1185" y="898" text-anchor="middle">连续命中红区</text>
  <polygon class="decision" points="1450,836 1595,881 1450,926 1305,881"/>
  <text class="text" x="1450" y="877" text-anchor="middle">命中达标?</text>
  <rect class="node done" x="1055" y="1000" width="250" height="62"/>
  <text class="text" x="1180" y="1026" text-anchor="middle">applyCatch</text>
  <text class="small" x="1180" y="1048" text-anchor="middle">奖励 + 天气/季节加成</text>
  <rect class="node done" x="735" y="1000" width="250" height="62"/>
  <text class="text" x="860" y="1026" text-anchor="middle">更新图鉴/历史/统计</text>
  <text class="small" x="860" y="1048" text-anchor="middle">记录最大重量和收益</text>
  <rect class="node done" x="415" y="1000" width="250" height="62"/>
  <text class="text" x="540" y="1026" text-anchor="middle">结果弹窗</text>
  <text class="small" x="540" y="1048" text-anchor="middle">展示稀有度与环境加成</text>
  <rect class="node" x="160" y="1000" width="190" height="62"/>
  <text class="text" x="255" y="1026" text-anchor="middle">saveUser</text>
  <text class="small" x="255" y="1048" text-anchor="middle">回到 idle</text>

