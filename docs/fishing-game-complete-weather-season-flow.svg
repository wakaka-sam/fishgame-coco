<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="2600" viewBox="0 0 1900 2600">
  <defs>
    <style>
      .bg { fill: #f5f8fc; }
      .title { font: 700 38px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #142033; }
      .subtitle { font: 500 18px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #586579; }
      .lane { fill: #ffffff; stroke: #d7e0ee; stroke-width: 2; rx: 20; }
      .laneTitle { font: 700 24px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #14213d; }
      .node { fill: #ffffff; stroke: #8ba0ba; stroke-width: 2; rx: 12; }
      .start { fill: #e8f8ef; stroke: #31a66a; }
      .core { fill: #eaf6ff; stroke: #2f8fd7; }
      .system { fill: #f1ecff; stroke: #7b61ff; }
      .weather { fill: #ecfff8; stroke: #14a36f; }
      .season { fill: #fff4de; stroke: #d99b1d; }
      .decision { fill: #fff9e8; stroke: #dfa400; }
      .danger { fill: #fff0ef; stroke: #e45d55; }
      .done { fill: #eafcff; stroke: #00a6c8; }
      .text { font: 500 17px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f2b3d; }
      .small { font: 500 14px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #526071; }
      .tiny { font: 500 12px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #647086; }
      .arrow { fill: none; stroke: #596579; stroke-width: 2.2; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #8693a6; stroke-width: 1.8; marker-end: url(#softArrow); }
      .dash { fill: none; stroke: #8693a6; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#softArrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#596579"/>
    </marker>
    <marker id="softArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9 Z" fill="#8693a6"/>
    </marker>
  </defs>

  <rect class="bg" width="1900" height="2600"/>
  <text class="title" x="80" y="72">钓鱼游戏完整流程图：原有流程 + 天气预报 + 季节系统</text>
  <text class="subtitle" x="80" y="108">这版保留第一版的主玩法和外围系统，再把天气、预报、季节接入主循环、UI、数值和存档</text>

  <rect class="node start" x="735" y="145" width="430" height="70"/>
  <text class="text" x="950" y="174" text-anchor="middle">游戏启动</text>
  <text class="small" x="950" y="198" text-anchor="middle">loadUser / normalize / 初始化运行时状态</text>

  <rect class="lane" x="70" y="255" width="1760" height="320"/>
  <text class="laneTitle" x="105" y="302">1. 启动、存档与环境初始化</text>
  <rect class="node" x="115" y="340" width="245" height="66"/>
  <text class="text" x="238" y="367" text-anchor="middle">原有玩家数据</text>
  <text class="small" x="238" y="389" text-anchor="middle">金币/钻石/鱼饵/图鉴/历史</text>
  <rect class="node" x="405" y="340" width="245" height="66"/>
  <text class="text" x="528" y="367" text-anchor="middle">原有收藏数据</text>
  <text class="small" x="528" y="389" text-anchor="middle">鱼竿/角色/宠物/首饰</text>
  <rect class="node weather" x="695" y="340" width="245" height="66"/>
  <text class="text" x="818" y="367" text-anchor="middle">新增 calendar</text>
  <text class="small" x="818" y="389" text-anchor="middle">gameDay / lastTickAt</text>
  <rect class="node season" x="985" y="340" width="245" height="66"/>
  <text class="text" x="1108" y="367" text-anchor="middle">季节系统</text>
  <text class="small" x="1108" y="389" text-anchor="middle">春/夏/秋/冬</text>
  <rect class="node weather" x="1275" y="340" width="245" height="66"/>
  <text class="text" x="1398" y="367" text-anchor="middle">天气与预报</text>
  <text class="small" x="1398" y="389" text-anchor="middle">今日天气 + 未来 3-7 天</text>
  <rect class="node done" x="760" y="470" width="380" height="62"/>
  <text class="text" x="950" y="496" text-anchor="middle">resolveEnvironmentEffects</text>
  <text class="small" x="950" y="518" text-anchor="middle">合并季节、天气、首饰、宠物、活动效果</text>
  <path class="arrow" d="M950 215 L950 255"/>
